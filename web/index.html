<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pega un repositorio de GitHub, GitLab o Bitbucket y mira quién depende de quién y dónde se concentra el cambio." />
    <meta name="theme-color" content="#0d1526" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CodeMap</title>
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('codemap-theme');
        } catch {}
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved ?? (prefersDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
